name: CI

on:
  push:
  pull_request:

jobs:
  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pio
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: pio-${{ hashFiles('ErgoSensePlatIO/platformio.ini') }}

      - name: Instalar PlatformIO
        run: pip install platformio

      - name: Credenciais fake p/ build
        run: cp ErgoSensePlatIO/include/credentials.example.h ErgoSensePlatIO/include/credentials.h

      - name: Build
        run: pio run -d ErgoSensePlatIO

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar deps
        run: pip install flake8

      - name: flake8
        run: flake8 python
